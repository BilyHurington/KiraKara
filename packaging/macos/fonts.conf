<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig for the bundled ffmpeg (libass) and fc-list / fc-match: the system and user font folders -->
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/AssetsV2</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/Library/Caches/MiliKara/fontconfig</cachedir>
</fontconfig>
